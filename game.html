        var min = document.getElementById("min");
        var sec = document.getElementById("sec");
        var total = 90; //設定倒數90秒
        var totalObject = 10;
        var m = parseInt(total / 60);
        var s = total - m * 60;
        min.innerHTML = m;
        sec.innerHTML = s;
        var t = setInterval("countDown()", 1000);
        function countDown() {
            total--;
            var m = parseInt(total / 60);
            var s = total - m * 60;
            min.innerHTML = m;
            sec.innerHTML = s;
            if (total < 10) { //進入倒數10秒
                //倒數10秒要做的事寫在這裡
                $("#objCount").css("color", "red");
                if (total <= 0) { //時間到
                    clearInterval(t);
                    $("#popWindow").show();
                    //在這裡加入時間結束後要做的事
                }
            }
        }
