<!DOCTYPE html>
<html lang="en">

<head>

    <title>起源</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        .banner {
            width: 100%;
            height: 1000px;
            margin: auto;
            position: relative;

        }

        .bg {
            width: 100%;
            height: auto;
            position: absolute;
            top: 0;
            left: 0;
            z-index: -999;
        }

        .menu-box {
            width: 97%;
            top: 30px;
            display: flex;
            align-items: center;
            position: relative;
            justify-content: flex-end;

        }

        .logo {
            width: 25%;
            left: 50px;
            align-items: center;
            position: relative;

        }

        .logo img {
            width: 80%;
            position: absolute;
            top: 0;
            left: 0%;
            z-index: -888;

        }

        .menu-bar {
            width: 15%;
            display: flex;
            align-items: center;
            flex-direction: row;
        }

        .menu-bar img {
            width: 80%;
        }

        .menu-barb {
            width: 15%;
            display: flex;
            align-items: center;
            flex-direction: row;
        }

        .menu-barb img {
            width: 70%;
        }

        @keyframes move {
            from {
                left: 110%;
                top: 100px;
                transform: scale(1.0);
            }

            to {
                left: -100px;
                top: 400px;
                transform: scale(1.1);
            }
        }

        @keyframes move2 {
            from {
                left: -100px;
               
            }

            to {
                left: 110%;
                
            }
        }

        @keyframes move3 {
            from {
                left: -150px;
               
            }

            to {
                left: 110%;
                
            }
        }

        .bird {
            width: 100%;
            height: 500px;
            top: 15%;
            margin: auto;
            overflow: hidden;
            position: absolute;
            z-index: 10;
        }

        .birdpic {
            top: 300px;
            left: 1500px;
            width: 5%;
            position: absolute;
            animation: move 10s infinite linear;

        }

        .mai {
            width: 100%;
            height: 180px;
            top: 2150px;
            margin: auto;
            overflow: hidden;
            position: absolute;
            z-index: 10;
        }

        .maipic {
            left: 1300px;
            width: 15%;
            position: absolute;
            animation: move2 20s infinite linear;

        }

        .boat {
            width: 100%;
            height: 300px;
            top: 350%;
            margin: auto;
            overflow: hidden;
            position: absolute;
            z-index: 10;
        }

        .boatpic {
            top: 40%;
            left: 110%;
            width: 10%;
            position: absolute;
            animation: move3 20s infinite linear alternate-reverse;

        }

        .wave {
            width: 150px;
            height: 100px;
            left: 10%;
            top: 200px;
            margin: auto;
            position: absolute;
            z-index: 5;
        }

        .wave1 {

        .wave5 {

    <script>
        $(".jq-goTop").click(function (e) {
            e.preventDefault();
            $("html,body").animate(
                {
                    scrollTop: 0,
                },
                600
            );
        });

        $("#audio-01").click(function () {
            var music = document.getElementById("music");
            if (music.paused) {
                music.play();
                $("#music_btn").attr("src", "images/聲音按鈕-02.png");
            } else {
                music.pause();
                $("#music_btn").attr("src", "images/聲音按鈕-01.png");
            }
        });

    </script>
