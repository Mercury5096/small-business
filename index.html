            function audioById(id) {
                return document.getElementById(id);

            function safelyPlay(audio) {
                if (!audio) return;
                var playRequest = audio.play();
                if (playRequest && typeof playRequest.catch === "function") {
                    playRequest.catch(function () {});
                }
            }

            function unlockBoothSounds() {
                if (unlocked) return;
                unlocked = true;

                boothSounds.forEach(function (id) {
                    var audio = audioById(id);
                    if (!audio) return;

                    audio.muted = true;
                    var playRequest = audio.play();
                    if (playRequest && typeof playRequest.then === "function") {
                        playRequest.then(function () {
                            audio.pause();
                            audio.currentTime = 0;
                            audio.muted = false;
                        }).catch(function () {
                            audio.muted = false;
                        });
                    } else {
                        audio.pause();
                        audio.currentTime = 0;
                        audio.muted = false;
                    }
                });
            }

            document.addEventListener("click", unlockBoothSounds, { once: true });
            document.addEventListener("keydown", unlockBoothSounds, { once: true });
